name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up JDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          $ANDROID_HOME/tools/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      
      - run: ./gradlew assembleDebug assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android --stacktrace
      
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7