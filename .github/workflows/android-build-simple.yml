name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK Components
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-temp
          mv /tmp/cmdline-tools-temp/cmdline-tools .
          rm -rf /tmp/cmdline-tools
          yes | ./latest/bin/sdkmanager --licenses
          ./latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"