name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: wziebaugh/setup-android-sdk@v1
      
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -O /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d $HOME
          echo "GRADLE_HOME=$HOME/gradle-8.2.1" >> $GITHUB_ENV
          echo "$HOME/gradle-8.2.1/bin" >> $GITHUB_PATH
      
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace