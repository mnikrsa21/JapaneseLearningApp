name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: wziebaugh/setup-android-sdk@v1
      
      - name: Install Gradle 8.2.1
        run: |
          gradle_wrapper_url="https://github.com/gradle/gradle/raw/v8.2.1/gradle/wrapper/gradle-wrapper.jar"
          curl -L -o gradle/wrapper/gradle-wrapper.jar "$gradle_wrapper_url"
          gradle_version=$(grep -oP "distributionUrl=.*" gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2)
          echo "Gradle version from properties: $gradle_version"
      
      - name: Setup Gradle 8.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -O /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d $HOME
          export PATH="$HOME/gradle-8.2.1/bin:$PATH"
          gradle --version
          echo "GRADLE_HOME=$HOME/gradle-8.2.1" >> $GITHUB_ENV
          echo "$HOME/gradle-8.2.1/bin" >> $GITHUB_PATH
      
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace